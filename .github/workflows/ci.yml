name: CI

# The coprocessor program's crates (cargo deny), formatting, lints and tests, on x86-64 and on arm64 (the coprocessor's
# architecture, where NAPA takes its NEON path), with the lens calibration tool's tests against the
# built program; and the robot client's Gradle ci. On every branch's pushes and pull requests.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, check, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      # Actions are pinned to a commit (the version beside it), so a moved tag can't change what
      # runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml's compiler, with its formatter and linter.
      - name: Rust, and libclang for the V4L2 bindings
        run: |
          rustup toolchain install --no-self-update
          sudo apt-get install -y libclang-dev
      - name: cargo-deny, at a fixed version, built from crates.io with its own lock file
        run: cargo install --locked cargo-deny@0.20.2
      - name: Licences, advisories, sources (deny.toml)
        run: cargo deny --locked check
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Lens calibration tool, through the built program
        env:
          VISOR_BIN: target/release/visor
        run: uv run tools/test_calibrate.py
      - name: Calibration capture tool
        run: uv run tools/test_capture.py

  client:
    name: Java client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches Gradle, its dependencies, and the JDK 25 toolchain Gradle downloads on first use.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Formatting, static analysis, tests, coverage
        working-directory: client
        run: ./gradlew ci
