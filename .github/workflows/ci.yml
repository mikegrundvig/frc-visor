name: CI

# The coprocessor program's formatting, lints and tests, on x86-64 and on arm64 (the coprocessor's
# architecture, where NAPA takes its NEON path), and the robot client's Gradle ci. On every
# branch's pushes and pull requests.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, check, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      # Actions are pinned to a commit (the version beside it), so a moved tag can't change what
      # runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust's formatter and linter, and libclang for the V4L2 bindings
        run: |
          rustup component add rustfmt clippy
          sudo apt-get install -y libclang-dev
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked

  client:
    name: Java client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches Gradle, its dependencies, and the JDK 25 toolchain Gradle downloads on first use.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Formatting, static analysis, tests, coverage
        working-directory: client
        run: ./gradlew ci
