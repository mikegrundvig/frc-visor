name: Release

# A tag vYEAR.MONTH.DAY, Cargo.toml's version, builds the coprocessor program on GitHub's arm64
# runner (the coprocessors' architecture), tests it there, and attaches it to the tag's GitHub
# release with its SHA-256: visor-<version>-linux-arm64.tar.gz, holding the program, its licence and
# notices, the chrony configuration, Visor's Spotter pack (spotter/visor/), and os/, what a board's
# image installs for Visor (tools/package.sh says what).
# tools/release.sh then publishes it into frc-maven beside the client.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  program:
    name: The arm64 program
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write # to create the tag's release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: libclang for the V4L2 bindings
        run: sudo apt-get install -y libclang-dev
      - name: The tag is the package's version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but Cargo.toml's version is $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      # tools/package.sh, which tests/package.rs checks member by member.
      - name: Package
        run: |
          archive="$(tools/package.sh target/release/visor .)"
          name="$(basename "$archive")"
          sha256sum "$name" > "$name.sha256"
          cat "$name.sha256"
      - name: The tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" visor-*.tar.gz visor-*.tar.gz.sha256 \
            --title "Visor $VERSION" \
            --notes "The coprocessor program for arm64, built from this tag. A robot's deploy takes it from frc-maven (com.michaelgrundvig.frc:visor:$VERSION) for the robot client of the same version."
