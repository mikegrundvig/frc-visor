name: Release

# A tag vYEAR.MONTH.DAY, Cargo.toml's version, builds the coprocessor program on GitHub's arm64
# runner (the coprocessors' architecture), tests it there, and attaches it to the tag's GitHub
# release with its SHA-256: visor-<version>-linux-arm64.tar.gz, holding the program, its licence and
# notices (NAPA's, and the crates it's built from with their licences), the chrony configuration,
# Visor's Spotter pack (spotter/visor/), and os/, what a board's image installs for Visor
# (tools/package.sh says what).
# tools/release.sh then publishes it into frc-maven beside the client.
#
# Two jobs, so no build code runs where the release can be written: the first builds, tests and
# packages with read access only, and leaves the archive as an artifact; the second runs nothing of
# the repository's, and publishes that archive, with its checksum, as the tag's release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  program:
    name: The arm64 program
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml's compiler.
      - name: Rust, and libclang for the V4L2 bindings
        run: |
          rustup toolchain install --no-self-update
          sudo apt-get install -y libclang-dev
      # The package lists the crates the program is built from, and their licences, with it.
      - name: cargo-deny, at a fixed version, built from crates.io with its own lock file
        run: cargo install --locked cargo-deny@0.20.2
      - name: The tag is the package's version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but Cargo.toml's version is $version" >&2
            exit 1
          fi
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      # tools/package.sh, which tests/package.rs checks member by member.
      - name: Package
        run: |
          mkdir out
          tools/package.sh target/release/visor out
          ls -l out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive
          path: out/visor-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    needs: program
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # to create the tag's release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archive
          path: out
      - name: Checksum
        working-directory: out
        run: |
          for archive in visor-*.tar.gz; do sha256sum -- "$archive" > "$archive.sha256"; done
          cat ./*.sha256
      - name: The tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" out/visor-*.tar.gz out/visor-*.tar.gz.sha256 \
            --verify-tag --title "Visor $version" \
            --notes "The coprocessor program for arm64, built from this tag. A robot's deploy takes it from frc-maven (com.michaelgrundvig.frc:visor:$version) for the robot client of the same version."
