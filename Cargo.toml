[package]
name = "visor"
# The version is a date, and the version ID every frame carries is made from it: 2026.11.2 is 20261102.
version = "2026.11.8"
edition = "2024"
license = "GPL-3.0-only"
description = "AprilTag vision for an FRC robot's coprocessor: USB cameras, NAPA, raw corners to the robot over UDP"
repository = "https://github.com/mikegrundvig/frc-visor"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive"] }
embedded-graphics = "0.8"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
fast_image_resize = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jpeg-encoder = "0.7"
libc = "0.2"
log = "0.4"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
socket2 = "0.6"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tokio-io-timeout = "1"
toml = { version = "0.9", features = ["preserve_order"] }
v4l = "0.14"

[build-dependencies]
cc = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
ureq = "3"

[profile.release]
lto = "thin"
codegen-units = 1

# The live view's resizing and JPEG, optimised in debug builds too, as NAPA is, so the tests' views
# run at their rate.
[profile.dev.package.fast_image_resize]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3
