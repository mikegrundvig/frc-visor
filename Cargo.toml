[package]
name = "visor"
# The version is a date, and the version ID every frame carries is made from it: 2026.11.2 is 20261102.
version = "2026.11.6"
edition = "2024"
license = "GPL-3.0-only"
description = "AprilTag vision for an FRC robot's coprocessor: USB cameras, NAPA, raw corners to the robot over UDP"
repository = "https://github.com/mikegrundvig/frc-visor"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
libc = "0.2"
log = "0.4"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", features = ["preserve_order"] }
v4l = "0.14"

[build-dependencies]
cc = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
