# chrony on the coprocessor: keep the wall clock on the robot program's clock.
#
# The robot program answers NTP on UDP 5806 with its own clock plus 2026-01-01T00:00:00Z, so this
# computer's wall clock becomes robot time plus that epoch, which is how Visor stamps frames. Replace
# 10.12.34.2 with your robot controller's address (10.TE.AM.2).
#
# minpoll -3 polls 8 times a second; iburst gets a first estimate in under a second (measured 0.27 s
# on loopback). maxpoll 0 keeps polling at least once a second, so a restarted robot program is
# picked up quickly. makestep with a limit of -1 lets chrony step the clock whenever it is more than
# 0.1 s off, not only at start: a rebooted robot controller starts its clock again from zero.
server 10.12.34.2 port 5806 iburst minpoll -3 maxpoll 0
makestep 0.1 -1

# Never remove this line. On Linux, chrony clears the kernel's "unsynchronised" flag (STA_UNSYNC)
# only when rtcsync is on. Visor reads that flag (src/clock.rs) to mark each frame synced or not,
# and the robot discards every frame that isn't marked synced. Without rtcsync the flag stays set
# for good, so the robot gets no tags at all from Visor, however well chrony tracks. Its only side
# effect is harmless: the kernel copies the clock to the real-time clock every 11 minutes.
rtcsync

# No other time sources: robot time is the only time that matters here.
driftfile /var/lib/chrony/chrony.drift
