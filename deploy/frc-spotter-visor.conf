# What Visor's Spotter pack needs of the agent (spotter/visor/README.md): /opt/visor to write, where
# it installs Visor and its configuration. The "-" lets the agent start when the folder can't be
# made writable (it isn't there, or its mount failed), so the robot still sees the board.
[Service]
ReadWritePaths=-/opt/visor
