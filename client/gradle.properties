# Gradle's own speed-ups. The configuration cache skips configuring the project when a build asks
# for what the last one did; the build cache reuses a task's outputs when its inputs match an
# earlier run's.
org.gradle.configuration-cache=true
org.gradle.caching=true
# Dependency verification: gradle/verification-metadata.xml holds the checksum of each library and
# plugin the build downloads, and Gradle checks downloads against it. Lenient: one the file lacks,
# or whose checksum differs, is reported, and the build goes on.
org.gradle.dependency.verification=lenient
