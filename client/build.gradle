// The robot's side of Visor (settings.gradle). It runs in the robot program, beside the 20 ms loop,
// so the steady state allocates nothing: frames decode into reused objects, and the receive thread
// hands them over through a fixed ring (ZeroAllocationTest checks it).

plugins {
    id "java-library"
    id "jacoco"
    alias(libs.plugins.spotless)
    alias(libs.plugins.errorprone)
}

// Published as com.michaelgrundvig.frc:frc-visor-client (gradle/publishing.gradle, at the end).
group = "com.michaelgrundvig.frc"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    // Spotter's, for the test of Visor's pack (../spotter/visor) on its agent: only Spotter's own.
    exclusiveContent {
        forRepository {
            maven { url = "https://mikegrundvig.github.io/frc-spotter/maven" }
        }
        filter {
            includeModule "com.michaelgrundvig.frc", "spotter-manager"
        }
    }
    // Spotter's agent is a Linux program, which Spotter publishes with its GitHub release and
    // nowhere else (frc-spotter-<version>-linux-<amd64 or arm64>.tar.gz). So it's read from there,
    // as mikegrundvig:frc-spotter, which only that release serves.
    exclusiveContent {
        forRepository {
            ivy {
                name = "spotterReleases"
                url = "https://github.com"
                patternLayout {
                    artifact "[organisation]/[module]/releases/download/v[revision]/[module]-[revision]-[classifier].[ext]"
                }
                metadataSources { artifact() }
            }
        }
        filter {
            includeModule "mikegrundvig", "frc-spotter"
        }
    }
}

// The agent's release, for the pack's test, on Linux alone (the program runs nowhere else).
def agentArchitecture = [amd64: "amd64", x86_64: "amd64", aarch64: "arm64"][System.getProperty("os.arch")]
def agentRuns = System.getProperty("os.name").toLowerCase().contains("linux") && agentArchitecture != null
configurations {
    spotterAgent {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    // @Nullable, in the API.
    api libs.jspecify

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
    testImplementation libs.jackson.databind
    testImplementation libs.spotter.manager
    if (agentRuns) {
        spotterAgent "mikegrundvig:frc-spotter:${libs.versions.spotter.get()}:linux-${agentArchitecture}@tar.gz"
    }
}

// The agent's program out of its release, for VisorPackTest to run.
def spotterAgentProgram = tasks.register("spotterAgentProgram", Sync) {
    description = "Unpacks Spotter's agent from its release, for VisorPackTest to run."
    onlyIf { agentRuns }
    from({
        configurations.spotterAgent.collect {
            tarTree(resources.gzip(it))
        }
    }) {
        include "*/usr/lib/frc-spotter/bin/frc-spotter"
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir("spotter-agent")
}

tasks.withType(JavaCompile).configureEach {
    // As the robot program compiles: the client runs on the robot.
    options.compilerArgs.add "-XDstringConcat=inline"
}

// Visor's version (../Cargo.toml) as a resource, so the client knows the version ID frames from the
// same release carry. One owner of the version: the Rust package's.
def visorVersion = providers.fileContents(layout.projectDirectory.file("../Cargo.toml")).asText.map { text ->
    def match = text =~ /(?m)^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"/
    if (!match.find()) {
        throw new GradleException("../Cargo.toml has no version = \"year.month.day\"")
    }
    "${match.group(1)}.${match.group(2)}.${match.group(3)}".toString()
}
// And the SHA-256 of the release archive a release publishes beside it (-PvisorTarball, below), so
// a robot's build and its boards take only that archive (VisorVersion.RELEASE_SHA256). One owner of
// the hash: the archive itself. A build without one (a developer's) writes it empty.
def releaseSha256 = providers.fileContents(layout.projectDirectory.file(providers.gradleProperty("visorTarball")))
        .asBytes
        .map { bytes -> java.security.MessageDigest.getInstance("SHA-256").digest(bytes).encodeHex().toString() }
        .orElse("")
def generatedResources = layout.buildDirectory.dir("generated/resources/visor")
def writeVersion = tasks.register("writeVisorVersion") {
    def version = visorVersion
    def sha256 = releaseSha256
    inputs.property("version", version)
    inputs.property("releaseSha256", sha256)
    outputs.dir(generatedResources)
    doLast {
        def file = generatedResources.get().file("com/michaelgrundvig/frc/visor/version.properties").asFile
        file.parentFile.mkdirs()
        file.text = "version=${version.get()}\nrelease-sha256=${sha256.get()}\n"
    }
}
sourceSets.main.resources.srcDir(writeVersion)

tasks.named("test") {
    useJUnitPlatform()
    // The frames Visor's own tests check against: the golden file.
    systemProperty "visor.testdata", file("../testdata").absolutePath
    inputs.dir("../testdata").withPropertyName("testdata").withPathSensitivity(PathSensitivity.RELATIVE)
    // Visor's Spotter pack, and the agent that runs it, for VisorPackTest.
    systemProperty "visor.pack", file("../spotter/visor").absolutePath
    inputs.dir("../spotter/visor").withPropertyName("pack").withPathSensitivity(PathSensitivity.RELATIVE)
    if (agentRuns) {
        def program = spotterAgentProgram.map { new File(it.destinationDir, "frc-spotter") }
        inputs.file(program).withPropertyName("spotterAgent").withPathSensitivity(PathSensitivity.NAME_ONLY)
        jvmArgumentProviders.add({
            [
                "-Dvisor.spotterAgent=${program.get().absolutePath}".toString()
            ]
        } as CommandLineArgumentProvider)
    }
    // chrony, where a developer has it, for the responder's test against the real thing.
    def chronyd = System.getenv("VISOR_CHRONYD")
    if (chronyd != null) {
        systemProperty "visor.chronyd", chronyd
    }
}

apply from: file("gradle/quality.gradle")

ext.published = [
    artifactId: "frc-visor-client",
    name: "Visor client",
    description: "The robot's side of Visor, AprilTag vision on a coprocessor: decoding and receiving its frames, answering chrony with the robot's clock, and its poses in WPILib's axes.",
    repository: "frc-visor",
    license: "BSD 3-Clause License",
    licensePath: "client/LICENSE",
    version: visorVersion.get(),
]
apply from: file("gradle/publishing.gradle")

// The coprocessor program itself, beside the client and at its version: com.michaelgrundvig.frc:visor,
// visor-<version>-linux-arm64.tar.gz (the program, its licence and notices, the chrony configuration,
// the Spotter pack and what a board's image installs, tools/package.sh), as the release workflow
// builds it on GitHub's arm64 runner. A robot's
// deploy takes it from there for the client it's built with. tools/release.sh downloads it from the
// tag's GitHub release, checks its SHA-256 and hands it over as -PvisorTarball.
def visorTarball = providers.gradleProperty("visorTarball").map { file(it) }
publishing.publications {
    program(MavenPublication) {
        artifactId = "visor"
        version = visorVersion.get()
        if (visorTarball.present) {
            artifact(visorTarball.get()) {
                classifier = "linux-arm64"
                extension = "tar.gz"
            }
        }
        pom {
            name = "Visor"
            description = "AprilTag vision for an FRC robot's coprocessor, built for arm64: the program a robot's deploy puts on each coprocessor."
            url = "https://github.com/mikegrundvig/frc-visor"
            packaging = "pom"
            licenses {
                license {
                    name = "GNU General Public License, version 3 only"
                    url = "https://github.com/mikegrundvig/frc-visor/blob/main/LICENSE"
                    distribution = "repo"
                }
            }
            scm {
                url = "https://github.com/mikegrundvig/frc-visor"
            }
        }
    }
}
tasks.named("publishAllPublicationsToFrcMavenRepository") {
    def tarball = visorTarball
    def expected = "visor-${visorVersion.get()}-linux-arm64.tar.gz"
    doFirst {
        if (!tarball.present) {
            throw new GradleException("A release publishes the coprocessor program too: -PvisorTarball=<${expected}>, from the tag's GitHub release (tools/release.sh does it)")
        }
        if (tarball.get().name != expected) {
            throw new GradleException("${tarball.get().name} isn't this release's program, ${expected}")
        }
    }
}
